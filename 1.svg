<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 750 704">
  <defs>
    <style>
      .pill   { fill:#BAE6FD; stroke:#0284C7; stroke-width:1.5; }
      .node   { fill:#E0F2FE; stroke:#0EA5E9; stroke-width:1.5; }
      .node-core { fill:#EDE9FE; stroke:#7C3AED; stroke-width:1.6; }
      .node-decision { fill:#FFEDD5; stroke:#EA580C; stroke-width:1.5; }
      .label { fill:#1E293B; font-size:14px; font-family:Microsoft YaHei UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif; }
      .label-sub { fill:#64748B; font-size:12px; font-family:Microsoft YaHei UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif; }
      .edge { fill:none; stroke:#64748B; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
      .edge-label { fill:#475569; font-size:12px; font-family:Microsoft YaHei UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif; }
      .title { fill:#1E293B; font-size:16px; font-weight:600; font-family:Microsoft YaHei UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- ===== 连线（先画线，再画节点） ===== -->
  <path class="edge" marker-end="url(#arrow)" d="M 188 126 L 188 172"/>
  <path class="edge" marker-end="url(#arrow)" d="M 188 228 L 188 274"/>
  <path class="edge" marker-end="url(#arrow)" d="M 188 330 L 188 376"/>
  <!-- 判断分支：是 -->
  <path class="edge" marker-end="url(#arrow)" d="M 348 426 L 408 426"/>
  <!-- 判断分支：否 -->
  <path class="edge" marker-end="url(#arrow)" d="M 188 476 L 188 522"/>
  <path class="edge" marker-end="url(#arrow)" d="M 548 454 L 548 516"/>
  <!-- ReAct 回环：Observation -> Thought -->
  <path class="edge" marker-end="url(#arrow)" d="M 688 544 L 722 544 L 722 302 L 348 302"/>
  <path class="edge" marker-end="url(#arrow)" d="M 188 578 L 188 624"/>

  <!-- ===== 边标注 ===== -->
  <text class="edge-label" x="378" y="414" text-anchor="middle">是</text>
  <text class="edge-label" x="200" y="504" text-anchor="start">否</text>
  <text class="edge-label" x="716" y="428" text-anchor="end">迭代</text>

  <!-- ===== 标题 ===== -->
  <text class="title" x="375" y="40" text-anchor="middle">LLM Agent（ReAct 范式）任务执行流程</text>

  <!-- ===== 节点 ===== -->
  <rect class="pill" x="58" y="76" width="260" height="50" rx="25"/>
  <text class="label" x="188" y="106" text-anchor="middle">开始：接收用户任务</text>

  <rect class="node" x="28" y="172" width="320" height="56" rx="10"/>
  <text class="label" x="188" y="205" text-anchor="middle">任务理解与规划（Planning）</text>

  <rect class="node-core" x="28" y="274" width="320" height="56" rx="10"/>
  <text class="label" x="188" y="296" text-anchor="middle">思考推理（Thought）</text>
  <text class="label-sub" x="188" y="318" text-anchor="middle">分析当前状态，决定下一步动作</text>

  <polygon class="node-decision" points="188,376 348,426 188,476 28,426"/>
  <text class="label" x="188" y="431" text-anchor="middle">是否需要调用外部工具？</text>

  <rect class="node" x="408" y="398" width="280" height="56" rx="10"/>
  <text class="label" x="548" y="420" text-anchor="middle">工具调用（Action）</text>
  <text class="label-sub" x="548" y="442" text-anchor="middle">搜索 / 代码执行 / API</text>

  <rect class="node" x="408" y="516" width="280" height="56" rx="10"/>
  <text class="label" x="548" y="538" text-anchor="middle">观察结果（Observation）</text>
  <text class="label-sub" x="548" y="560" text-anchor="middle">获取工具返回信息</text>

  <rect class="node" x="28" y="522" width="320" height="56" rx="10"/>
  <text class="label" x="188" y="555" text-anchor="middle">整合信息，生成最终答案</text>

  <rect class="pill" x="58" y="624" width="260" height="50" rx="25"/>
  <text class="label" x="188" y="654" text-anchor="middle">任务完成</text>
</svg>